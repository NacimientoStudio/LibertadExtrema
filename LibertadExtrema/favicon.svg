<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 50,5 L 88,22 L 80,72 L 50,95 L 20,72 L 12,22 Z" fill="#0D0E12" stroke="url(#fireGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Inner Helmet / Wheel Icon -->
  <circle cx="50" cy="48" r="24" fill="none" stroke="url(#chromeGrad)" stroke-width="4"/>
  <circle cx="50" cy="48" r="16" fill="none" stroke="url(#fireGrad)" stroke-width="2.5" stroke-dasharray="6, 3"/>
  <path d="M 32,48 L 68,48 M 50,30 L 50,66 M 37,35 L 63,61 M 37,61 L 63,35" stroke="url(#chromeGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Flame Wings -->
  <path d="M 22,35 C 10,25 25,10 32,25 Z" fill="url(#fireGrad)"/>
  <path d="M 78,35 C 90,25 75,10 68,25 Z" fill="url(#fireGrad)"/>

  <!-- Club Name Arc Text placeholder -->
  <polygon points="50,78 40,86 60,86" fill="url(#fireGrad)" filter="url(#glow)"/>
</svg>
